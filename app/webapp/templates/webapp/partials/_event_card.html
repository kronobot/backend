<a href="{% url 'webapp:event_detail' event_id=event.id %}" class="shrink-0 w-40 md:w-56 snap-start">
  <div class="relative h-30 rounded-lg overflow-hidden bg-surface {% if not event.image %} bg-gradient-to-br from-violet-600 to-fuchsia-600 {% endif %}" style="max-height: 250px; min-height: 250px">
    {% if event.image %}
      <img src="{{ event.image.url }}" alt="{{ event.name }}" class="w-full h-full object-cover object-top">
    {% else %}
      <div class="w-full h-full bg-gradient-to-br from-violet-600 to-fuchsia-500"></div>
    {% endif %}
    <div class="absolute inset-x-0 bottom-0 h-20 bg-gradient-to-t from-black/90 to-transparent"></div>
    <div class="absolute left-2 bottom-2 flex items-center gap-1 text-white text-[11px] md:text-xs font-medium">
      <svg viewBox="0 0 384 512" class="w-2.5 h-2.5 fill-current">
        <path d="M0 32C0 14.3 14.3 0 32 0S64 14.3 64 32V49.7c31.7-14.5 67-22.3 104.5-22.3c37.7 0 76 8.7 106.7 22.3c30.7 13.6 66.2 22.3 103.9 22.3c30.4 0 60.9-6.4 87.9-19.9c9.8-4.9 21.5-4.5 31 1.2s15 15.7 15 26.6l-.1 224c0 11.4-6.4 21.8-16.6 26.9c-33.6 17-72.9 25.1-113.4 25.1c-38.7 0-77.7-9.2-108.5-23.5c-30.6-14.3-64.9-22.5-99.9-22.5c-37.6 0-72.5 9.4-98.7 23.3L64 512z"/>
      </svg>
      <span>{{ event.category_label }}</span>
    </div>
  </div>
  <p class="mt-2 text-sm md:text-base text-ink leading-snug line-clamp-2">{{ event.name }}</p>
  <p class="text-xs md:text-sm text-muted mt-0.5">{{ event.start_date|date:"d M Y" }}</p>
</a>
